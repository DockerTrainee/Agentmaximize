<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentMaximize | Aon AI Factory</title>
    <meta name="description" content="Unlocking the full potential of your AI interactions through guided optimization.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ── Design Tokens ─────────────────────────────────────────── */
        :root {
            --primary: #6366F1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #10B981;
            --secondary-glow: rgba(16, 185, 129, 0.5);
            --bg: #0F172A;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-bright: rgba(51, 65, 85, 0.8);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, var(--primary), var(--secondary));
            --glass-effect: blur(12px);
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Reset ─────────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Base ──────────────────────────────────────────────────── */
        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }

        /* ── Scrollbar ─────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-bright); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── Watermark ─────────────────────────────────────────────── */
        .aon-watermark {
            position: fixed;
            bottom: 12px;
            right: 16px;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
            opacity: 0.25;
            pointer-events: none;
            letter-spacing: 0.1em;
        }

        /* ── Header & Brand ────────────────────────────────────────── */
        .aon-brand {
            padding: 2rem 4rem;
            animation: fadeIn 1s ease-out;
        }

        .aon-brand h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .aon-tagline {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        /* ── Layout ────────────────────────────────────────────────── */
        .aon-split-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            padding: 0 4rem 4rem 4rem;
            max-width: 1800px;
            margin: 0 auto;
            min-height: 80vh;
        }

        /* ── Content Area ──────────────────────────────────────────── */
        .aon-chat-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: slideInLeft 0.6s ease-out;
        }

        .aon-chat-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .aon-chat-container h2::before {
            content: '';
            display: block;
            width: 4px;
            height: 24px;
            background: var(--secondary);
            border-radius: 2px;
        }

        /* ── Controls & Switch ─────────────────────────────────────── */
        .aon-controls {
            display: flex;
            align-items: center;
        }

        .aon-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: var(--transition-fast);
        }

        .aon-switch:hover { color: var(--text-main); }

        .aon-switch input {
            appearance: none;
            width: 42px;
            height: 22px;
            background: var(--surface-bright);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid var(--border);
        }

        .aon-switch input:checked { background: var(--secondary); }

        .aon-switch input::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: var(--transition-fast);
        }

        .aon-switch input:checked::before { transform: translateX(20px); }

        /* ── Editor Box ────────────────────────────────────────────── */
        .aon-editor-box {
            background: var(--surface);
            backdrop-filter: var(--glass-effect);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: var(--transition-smooth);
        }

        .aon-editor-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .aon-editor-box label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1.1rem;
            resize: none;
        }

        .aon-action-bar {
            display: flex;
            justify-content: flex-end;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        /* ── Buttons ───────────────────────────────────────────────── */
        .aon-primary-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .aon-primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
            filter: brightness(1.1);
        }

        .aon-primary-btn:active { transform: translateY(0); }

        .aon-primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .aon-secondary-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .aon-secondary-btn:hover {
            background: var(--primary);
            color: white;
        }

        .aon-link-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-fast);
            margin-bottom: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .aon-link-btn:hover {
            background: var(--surface-bright);
            color: var(--text-main);
            border-color: var(--secondary);
            padding-left: 1.25rem;
        }

        /* ── Output Area ───────────────────────────────────────────── */
        .aon-output-area {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .aon-output-area h3 {
            font-size: 0.9rem;
            color: var(--secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* ── Sidebar & Cards ───────────────────────────────────────── */
        #aon-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: slideInRight 0.6s ease-out;
        }

        .aon-module-card {
            background: var(--surface);
            backdrop-filter: var(--glass-effect);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .aon-module-card h3 {
            font-size: 1.1rem;
            margin-bottom: 1.25rem;
            color: var(--text-main);
        }

        .aon-walkthrough-list { list-style: none; }

        /* ── Context Tips ──────────────────────────────────────────── */
        .aon-tip-item {
            cursor: pointer;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .aon-tip-item:last-child { border-bottom: none; }

        .aon-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border-radius: 4px;
            font-size: 0.7rem;
            margin-bottom: 0.4rem;
            letter-spacing: 0.05em;
        }

        .aon-tip-item p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        /* ── Template Card ─────────────────────────────────────────── */
        .aon-template-card {
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 0.5rem;
        }

        .aon-template-card strong {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* ── Result Card ───────────────────────────────────────────── */
        .aon-result-card p {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 1rem;
            white-space: pre-wrap;
        }

        /* ── Placeholders & Skeletons ──────────────────────────────── */
        .aon-placeholder {
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            min-height: 60px;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }

        .aon-placeholder::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: pulse 1.5s infinite;
        }

        /* ── Footer / Status Bar ───────────────────────────────────── */
        #aon-footer {
            padding: 1rem 4rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .aon-status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Context Wrapper ───────────────────────────────────────── */
        .aon-context-wrapper {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 1rem;
        }

        /* ── Prompt History ─────────────────────────────────────────── */
        .aon-history-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 280px;
            overflow-y: auto;
        }

        .aon-history-item {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.65rem 0.8rem;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-fast);
            animation: fadeIn 0.3s ease;
        }

        .aon-history-item:hover {
            border-color: var(--secondary);
            background: rgba(16, 185, 129, 0.06);
        }

        .aon-history-text {
            flex: 1;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition-fast);
        }

        .aon-history-item:hover .aon-history-text {
            color: var(--text-main);
        }

        .aon-history-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.6;
            white-space: nowrap;
            margin-top: 2px;
        }

        .aon-history-del {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.75rem;
            opacity: 0;
            transition: var(--transition-fast);
            flex-shrink: 0;
            line-height: 1;
        }

        .aon-history-item:hover .aon-history-del {
            opacity: 1;
        }

        .aon-history-del:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .aon-history-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            padding: 1rem;
            opacity: 0.6;
        }

        .aon-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .aon-history-header h3 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .aon-clear-btn {
            background: none;
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ef4444;
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition-fast);
        }

        .aon-clear-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        /* ── Animations ────────────────────────────────────────────── */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ── Responsive ────────────────────────────────────────────── */
        @media (max-width: 1280px) {
            .aon-split-layout {
                grid-template-columns: 1fr;
                padding: 0 2rem 2rem 2rem;
            }
            #aon-sidebar { flex-direction: row; }
            .aon-module-card { flex: 1; }
        }

        @media (max-width: 768px) {
            .aon-brand { padding: 1.5rem; }
            #aon-sidebar { flex-direction: column; }
            .aon-split-layout { padding: 1rem; }
            #aon-footer { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="aon-brand">
        <h1>AgentMaximize</h1>
        <p class="aon-tagline">Optimizing human-AI synergy through precision engineering.</p>
    </div>

    <main id="aon-main" class="aon-split-layout">
        <section id="aon-content" data-module="mod_2" class="aon-chat-container">
            <h2>Prompt Refinement Lab</h2>
            <div class="aon-controls">
                <label class="aon-switch">
                    <span>Refinement Toggle</span>
                    <input type="checkbox" id="aon-refinement-toggle" checked>
                </label>
            </div>

            <div id="aon-prompt-editor" class="aon-editor-box">
                <label for="aon-input-1">Input Base Query</label>
                <textarea id="aon-input-1" placeholder="Enter your raw prompt here..."></textarea>
                <div class="aon-action-bar">
                    <button id="aon-btn-1" class="aon-primary-btn">Transform Instruction</button>
                </div>
            </div>

            <article id="aon-display-1" class="aon-output-area">
                <h3>Refined Output</h3>
                <div id="aon-data-refined-output" class="aon-placeholder">Loading...</div>
            </article>
        </section>

        <aside id="aon-sidebar">
            <!-- Prompt History Card -->
            <section class="aon-module-card" id="aon-history-card">
                <div class="aon-history-header">
                    <h3>Prompt History</h3>
                    <button class="aon-clear-btn" id="aon-btn-clear-history">Clear All</button>
                </div>
                <div class="aon-history-list" id="aon-history-list">
                    <p class="aon-history-empty">No prompts yet. Transform one to begin.</p>
                </div>
            </section>

            <section data-module="mod_1" class="aon-module-card">
                <h3>Contextual Guidance Engine</h3>
                <div class="aon-context-wrapper">
                    <div id="aon-data-context-tips" class="aon-placeholder">Loading...</div>
                </div>
            </section>

            <section data-module="mod_3" class="aon-module-card">
                <h3>Interactive Support Hub</h3>
                <nav id="aon-feature-discovery">
                    <ul class="aon-walkthrough-list">
                        <li><button class="aon-link-btn" id="aon-btn-discovery">Discovery Walkthrough</button></li>
                        <li><button class="aon-link-btn" id="aon-btn-capability">New Capabilities</button></li>
                    </ul>
                </nav>
                <div id="aon-data-support-feed" class="aon-placeholder">Loading...</div>
            </section>
        </aside>
    </main>

    <footer id="aon-footer">
        <div id="aon-data-system-status">Loading...</div>
    </footer>

    <div class="aon-watermark">⚡ AON AI FACTORY v5.0</div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /**
         * STATE MANAGEMENT
         */
        const state = {
            activeInput: "",
            currentOptimizedResult: "",
            selectedCapabilityFilter: "all",
            isGenerating: false,
            historyStack: [],
            mockData: {
                usage_patterns: [
                    {
                        raw_input: "write a summary of this text",
                        optimized_prompt: "Act as a professional editor. Provide a concise 3-bullet point summary of the following text, focusing on actionable insights.",
                        capability_tags: ["summarization", "professional_tone", "extraction"]
                    },
                    {
                        raw_input: "fix my python script",
                        optimized_prompt: "Analyze the provided Python script for logical errors and PEP8 compliance issues. Provide the corrected code with comments explaining each fix.",
                        capability_tags: ["debugging", "python", "optimization"]
                    }
                ],
                instruction_templates: [
                    {
                        template_id: "temp_001",
                        name: "Persona-Based Reasoning",
                        raw_input: "[User Topic]",
                        optimized_prompt: "You are an expert in [Field]. Step through your reasoning process for [User Topic] before providing a final conclusion.",
                        capability_tags: ["chain_of_thought", "expert_persona"]
                    }
                ]
            }
        };

        /**
         * DOM SELECTORS
         */
        const elements = {
            inputField:       document.getElementById('aon-input-1'),
            transformBtn:     document.getElementById('aon-btn-1'),
            refinedOutput:    document.getElementById('aon-data-refined-output'),
            contextTips:      document.getElementById('aon-data-context-tips'),
            supportFeed:      document.getElementById('aon-data-support-feed'),
            systemStatus:     document.getElementById('aon-data-system-status'),
            refinementToggle: document.getElementById('aon-refinement-toggle'),
            discoveryBtn:     document.getElementById('aon-btn-discovery'),
            capabilityBtn:    document.getElementById('aon-btn-capability')
        };

        /**
         * CORE UTILITIES
         */
        const updateUI = (target, content, isError = false) => {
            if (!target) return;
            target.innerHTML = content;
            target.style.color = isError ? '#ef4444' : '';
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        const setGeneratingState = (isGenerating) => {
            state.isGenerating = isGenerating;
            elements.transformBtn.disabled = isGenerating;
            elements.transformBtn.textContent = isGenerating ? "Processing..." : "Transform Instruction";

            if (isGenerating) {
                elements.refinedOutput.innerHTML = "<span style='color:var(--text-muted)'>Synthesizing optimal prompt structure...</span>";
            }
        };

        /**
         * EVENT HANDLERS
         */
        const handleInputChange = (e) => {
            state.activeInput = e.target.value;
        };

        const triggerPromptOptimization = async () => {
            if (!state.activeInput.trim()) {
                updateUI(elements.refinedOutput, "<span style='color:var(--text-muted)'>Please enter a base query first.</span>");
                return;
            }

            const useRefinement = elements.refinementToggle.checked;
            setGeneratingState(true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: state.activeInput,
                        mission: "how can i use this agent at it's best ?",
                        refine: useRefinement
                    })
                });

                const data = await response.json();

                // Handle server-side AI errors (quota / unavailable)
                if (!response.ok || data.error) {
                    const isQuota = data.code === 'QUOTA_EXCEEDED';
                    const icon = isQuota ? '⏳' : '⚠️';
                    const title = isQuota ? 'AI Rate Limited' : 'AI Temporarily Unavailable';
                    const msg = data.message || 'Something went wrong. Please try again.';
                    const hint = isQuota
                        ? 'The Gemini API free quota has been reached for this period. Please wait a few minutes and try again.'
                        : 'The AI engine failed to respond. Check server logs or try again shortly.';

                    elements.refinedOutput.innerHTML = `
                        <div style="display:flex;flex-direction:column;gap:0.75rem;padding:1rem;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:12px;">
                            <div style="display:flex;align-items:center;gap:0.6rem;">
                                <span style="font-size:1.3rem;">${icon}</span>
                                <strong style="color:#f87171;font-family:'Outfit',sans-serif;">${title}</strong>
                            </div>
                            <p style="color:#fca5a5;font-size:0.85rem;line-height:1.5;">${msg}</p>
                            <p style="color:var(--text-muted);font-size:0.78rem;line-height:1.5;">${hint}</p>
                            <button onclick="document.getElementById('aon-btn-1').click()"
                                style="align-self:flex-start;padding:0.4rem 1rem;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:'Inter',sans-serif;">
                                ↺ Retry
                            </button>
                        </div>`;
                    updateSystemStatus(title, true);
                    return;
                }

                state.currentOptimizedResult = data.reply || "Optimization complete. No significant changes suggested.";
                state.historyStack.push({ input: state.activeInput, output: state.currentOptimizedResult });

                // Save to persistent history
                addToHistory(state.activeInput, state.currentOptimizedResult);

                renderRefinedOutput();
                updateSystemStatus("System optimized successfully.");
            } catch (error) {
                console.error('Optimization Error:', error);
                elements.refinedOutput.innerHTML = `
                    <div style="display:flex;flex-direction:column;gap:0.6rem;padding:1rem;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:12px;">
                        <strong style="color:#f87171;">⚠️ Connection Error</strong>
                        <p style="color:var(--text-muted);font-size:0.82rem;">Could not reach the server. Make sure the Nexus server is running.</p>
                    </div>`;
                updateSystemStatus("Connection failed.", true);
            } finally {
                setGeneratingState(false);
            }
        };

        const applyTemplateToInput = (templateId) => {
            const template = state.mockData.instruction_templates.find(t => t.template_id === templateId);
            if (template) {
                elements.inputField.value = template.optimized_prompt;
                state.activeInput = template.optimized_prompt;
                elements.inputField.focus();

                // Micro-animation
                elements.inputField.style.transform = "scale(1.02)";
                setTimeout(() => elements.inputField.style.transform = "scale(1)", 200);
            }
        };

        const applyPatternToInput = (rawInput) => {
            elements.inputField.value = rawInput;
            state.activeInput = rawInput;
            elements.inputField.focus();
            elements.inputField.style.transform = "scale(1.02)";
            setTimeout(() => elements.inputField.style.transform = "scale(1)", 200);
        };

        /**
         * PROMPT HISTORY — localStorage persistence
         */
        const HISTORY_KEY = 'aon_prompt_history';
        const MAX_HISTORY = 50;

        const loadHistory = () => {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            } catch { return []; }
        };

        const saveHistory = (list) => {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        };

        const addToHistory = (rawInput, optimizedOutput) => {
            const history = loadHistory();
            // Avoid exact duplicate at top
            if (history.length > 0 && history[0].raw === rawInput) return;
            history.unshift({
                id: Date.now(),
                raw: rawInput,
                output: optimizedOutput,
                ts: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            saveHistory(history.slice(0, MAX_HISTORY));
            renderHistory();
        };

        const deleteHistoryItem = (id) => {
            const history = loadHistory().filter(h => h.id !== id);
            saveHistory(history);
            renderHistory();
        };

        const clearHistory = () => {
            if (!confirm('Clear all prompt history?')) return;
            localStorage.removeItem(HISTORY_KEY);
            renderHistory();
        };

        const renderHistory = () => {
            const list = document.getElementById('aon-history-list');
            if (!list) return;
            const history = loadHistory();

            if (history.length === 0) {
                list.innerHTML = '<p class="aon-history-empty">No prompts yet. Transform one to begin.</p>';
                return;
            }

            list.innerHTML = history.map(h => `
                <div class="aon-history-item" data-id="${h.id}">
                    <div style="flex:1; overflow:hidden;">
                        <div class="aon-history-text" title="${h.raw.replace(/"/g, '&quot;')}">${h.raw}</div>
                        <div class="aon-history-meta">${h.ts}</div>
                    </div>
                    <button class="aon-history-del" data-del="${h.id}" title="Remove">✕</button>
                </div>
            `).join('');

            // Attach listeners
            list.querySelectorAll('.aon-history-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('[data-del]')) return; // Let delete handle it
                    const entry = history.find(h => h.id === parseInt(item.dataset.id));
                    if (entry) {
                        applyPatternToInput(entry.raw);
                        // Also restore the output if available
                        if (entry.output) {
                            state.currentOptimizedResult = entry.output;
                            state.activeInput = entry.raw;
                            renderRefinedOutput();
                        }
                    }
                });
            });

            list.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteHistoryItem(parseInt(btn.dataset.del));
                });
            });
        };

        const copyOptimizedPromptToClipboard = () => {
            if (!state.currentOptimizedResult) return;
            navigator.clipboard.writeText(state.currentOptimizedResult)
                .then(() => {
                    const btn = document.getElementById('aon-btn-copy');
                    if (btn) {
                        btn.textContent = "Copied!";
                        setTimeout(() => { btn.textContent = "Copy to Clipboard"; }, 1500);
                    }
                });
        };

        /**
         * RENDERERS
         */
        const renderRefinedOutput = () => {
            if (!state.currentOptimizedResult) return;

            const html = `
                <div class="aon-result-card">
                    <p>${state.currentOptimizedResult}</p>
                    <div class="aon-action-bar">
                        <button class="aon-secondary-btn" id="aon-btn-copy">Copy to Clipboard</button>
                    </div>
                </div>
            `;
            updateUI(elements.refinedOutput, html);

            document.getElementById('aon-btn-copy')?.addEventListener('click', copyOptimizedPromptToClipboard);
        };

        const renderContextTips = () => {
            const patterns = state.mockData.usage_patterns;
            const html = patterns.map((p, i) => `
                <div class="aon-tip-item">
                    <small class="aon-tag">${p.capability_tags.join(', ')}</small>
                    <p><strong>Raw:</strong> ${p.raw_input}</p>
                    <button class="aon-link-btn aon-try-btn" data-index="${i}">Try this</button>
                </div>
            `).join('');
            updateUI(elements.contextTips, html);

            // Attach listeners using data attributes — no eval / inline handlers
            elements.contextTips.querySelectorAll('.aon-try-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pattern = patterns[parseInt(btn.dataset.index, 10)];
                    if (pattern) applyPatternToInput(pattern.raw_input);
                });
            });
        };

        const renderSupportFeed = () => {
            const templates = state.mockData.instruction_templates;
            const html = templates.map(t => `
                <div class="aon-template-card">
                    <strong>${t.name}</strong>
                    <button class="aon-primary-btn" style="display:block; margin-top:0.5rem; font-size:0.8rem; padding:0.5rem 1rem;" data-template="${t.template_id}">Use Template</button>
                </div>
            `).join('');
            updateUI(elements.supportFeed, html);

            elements.supportFeed.querySelectorAll('[data-template]').forEach(btn => {
                btn.addEventListener('click', () => applyTemplateToInput(btn.dataset.template));
            });
        };

        const updateSystemStatus = (msg, isError = false) => {
            const time = new Date().toLocaleTimeString();
            elements.systemStatus.innerHTML = `
                <span class="aon-status-indicator" style="background:${isError ? '#ef4444' : '#22c55e'};"></span>
                &nbsp;Status: ${msg} &nbsp;|&nbsp; Last Sync: ${time}
            `;
        };

        /**
         * INITIALIZATION
         */
        const init = () => {
            elements.inputField.addEventListener('input', handleInputChange);
            elements.transformBtn.addEventListener('click', triggerPromptOptimization);

            elements.discoveryBtn.addEventListener('click', () => {
                alert("Discovery Mode: Highlighting core AgentMaximize features. Use the Refinement Lab to upgrade base queries into high-performance LLM instructions.");
            });

            elements.capabilityBtn.addEventListener('click', async () => {
                try {
                    updateUI(elements.supportFeed, "<span style='color:var(--text-muted)'>Fetching new capabilities...</span>");
                    const res = await fetch('/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: "new_features" })
                    });
                    await res.json();
                    updateSystemStatus("Search capabilities updated.");
                    renderSupportFeed();
                } catch (e) {
                    updateUI(elements.supportFeed, "<span style='color:var(--text-muted)'>Capability search unavailable locally.</span>");
                    renderSupportFeed();
                }
            });

            // Initialize UI with mock data
            renderContextTips();
            renderSupportFeed();
            renderHistory();
            updateSystemStatus("AgentMaximize Core Online");

            document.getElementById('aon-btn-clear-history')?.addEventListener('click', clearHistory);

            // Initial refined output state
            elements.refinedOutput.textContent = "Enter a prompt and click Transform to see results.";
            elements.refinedOutput.classList.remove('aon-placeholder');

            // Micro-animations for buttons
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('mousedown', () => { if (!btn.disabled) btn.style.transform = "scale(0.95)"; });
                btn.addEventListener('mouseup',   () => btn.style.transform = "scale(1)");
                btn.addEventListener('mouseleave',() => btn.style.transform = "scale(1)");
                btn.style.transition = "transform 0.1s ease, opacity 0.2s ease";
            });

            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        init();
    });
    </script>
</body>
</html>
