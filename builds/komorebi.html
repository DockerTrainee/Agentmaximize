<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komorebi | Zen Travel Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --zen-green: #2d5a27;
            --zen-light: #e8f5e9;
            --accent: #81c784;
            --glass: rgba(255, 255, 255, 0.15);
            --bg: #0b140d;
        }
        * { margin:0; padding:0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: #f1f1f1; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .hero {
            height: 60vh;
            background: url('/brain/2dce2e1d-b46e-4d7d-b687-5d50b6057ff0/komorebi_travel_banner_1776248193976.png') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .hero::after {
            content: '';
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to bottom, transparent, var(--bg));
        }
        .hero-content {
            z-index: 10;
            text-align: center;
        }
        h1 { font-family: 'Outfit'; font-size: 4rem; letter-spacing: -2px; color: white; margin-bottom: 10px; }
        .tagline { opacity: 0.8; font-size: 1.2rem; }

        .container { max-width: 1200px; margin: -50px auto 50px; position: relative; z-index: 20; padding: 0 20px; }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .input-group { margin-bottom: 30px; }
        input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 16px; color: white; font-size: 1.1rem;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(129, 199, 132, 0.2); }
        .btn {
            background: var(--accent); color: #0b140d; padding: 20px 40px; border-radius: 16px;
            border: none; font-weight: 800; font-family: 'Outfit'; cursor: pointer; transition: 0.3s; width: 100%;
            font-size: 1.1rem;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(129, 199, 132, 0.4); }

        .aon-watermark {
            position: fixed; bottom: 20px; left: 20px; font-size: 10px; opacity: 0.4;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>KOMOREBI</h1>
            <p class="tagline">Zen Travel Intelligence & Stillness Seekers</p>
        </div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div class="input-group">
                <input type="text" placeholder="Where do you seek stillness? (e.g. Kyoto Forest, Swiss Alps)">
            </div>
            <button class="btn">Discover Silent Paths</button>
        </div>
    </div>

    <div class="aon-watermark">⚡ AON AI RECONSTRUCTION v6.1</div>

    <script>
        // SILENT NEURAL SURGEON PATCH
        window.onerror = function(msg, url, line, col, error) {
            const isExtension = (url && (url.includes('chrome-extension') || url.includes('moz-extension'))) || 
                                (msg && (msg.includes('Origin not allowed') || msg.includes('ExtensionContext')));
            if (!isExtension) {
                console.error('[AON CRASH]:', msg);
            } else {
                console.warn('[AON] Neutralized external interference:', msg);
            }
            return false;
        };
    </script>
</body>
</html>
