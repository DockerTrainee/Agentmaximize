<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentMaximize | Aon AI Factory</title>
    <meta name="description" content="Unlocking the full potential of your AI interactions through guided optimization.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366F1;
            --secondary: #10B981;
            --bg: #050507;
            --surface: rgba(15,15,20,0.85);
            --border: rgba(255,255,255,0.08);
            --text: #f0f0f5;
            --text-muted: rgba(255,255,255,0.5);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }
        h1,h2,h3,h4 { font-family: 'Outfit', sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        .aon-watermark {
            position: fixed; bottom: 12px; right: 16px;
            font-size: 11px; font-family: 'Outfit', sans-serif;
            opacity: 0.25; pointer-events: none; letter-spacing: 0.1em;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');

:root {
    --primary: #6366F1;
    --primary-glow: rgba(99, 102, 241, 0.5);
    --secondary: #10B981;
    --secondary-glow: rgba(16, 185, 129, 0.5);
    --bg: #0F172A;
    --surface: rgba(30, 41, 59, 0.7);
    --surface-bright: rgba(51, 65, 85, 0.8);
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --border: rgba(255, 255, 255, 0.1);
    --accent-gradient: linear-gradient(135deg, var(--primary), var(--secondary));
    --glass-effect: blur(12px);
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

body {
    background-color: var(--bg);
    background-image: 
        radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
}

h1, h2, h3 {
    font-family: 'Outfit', sans-serif;
    letter-spacing: -0.02em;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: var(--surface-bright);
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
}

/* Header & Brand */
.aon-brand {
    padding: 2rem 4rem;
    animation: fadeIn 1s ease-out;
}

.aon-brand h1 {
    font-size: 2.5rem;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
}

.aon-tagline {
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 300;
}

/* Layout */
.aon-split-layout {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 2rem;
    padding: 0 4rem 4rem 4rem;
    max-width: 1800px;
    margin: 0 auto;
    min-height: 80vh;
}

/* Content Area */
.aon-chat-container {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    animation: slideInLeft 0.6s ease-out;
}

.aon-chat-container h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
}

.aon-chat-container h2::before {
    content: '';
    display: block;
    width: 4px;
    height: 24px;
    background: var(--secondary);
    border-radius: 2px;
}

/* Controls & Switch */
.aon-controls {
    display: flex;
    align-items: center;
}

.aon-switch {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-muted);
    transition: var(--transition-fast);
}

.aon-switch:hover {
    color: var(--text-main);
}

.aon-switch input {
    appearance: none;
    width: 42px;
    height: 22px;
    background: var(--surface-bright);
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    transition: var(--transition-fast);
    border: 1px solid var(--border);
}

.aon-switch input:checked {
    background: var(--secondary);
}

.aon-switch input::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: var(--transition-fast);
}

.aon-switch input:checked::before {
    transform: translateX(20px);
}

/* Editor Box */
.aon-editor-box {
    background: var(--surface);
    backdrop-filter: var(--glass-effect);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    transition: var(--transition-smooth);
}

.aon-editor-box:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 20px var(--primary-glow);
}

.aon-editor-box label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 1rem;
}

textarea {
    width: 100%;
    min-height: 180px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 1.1rem;
    resize: none;
}

.aon-action-bar {
    display: flex;
    justify-content: flex-end;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
}

/* Buttons */
.aon-primary-btn {
    background: var(--accent-gradient);
    color: white;
    border: none;
    padding: 0.8rem 2rem;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition-fast);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
}

.aon-primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--primary-glow);
    filter: brightness(1.1);
}

.aon-primary-btn:active {
    transform: translateY(0);
}

.aon-link-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 100%;
    text-align: left;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition-fast);
    margin-bottom: 0.5rem;
}

.aon-link-btn:hover {
    background: var(--surface-bright);
    color: var(--text-main);
    border-color: var(--secondary);
    padding-left: 1.25rem;
}

/* Output Area */
.aon-output-area {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
}

.aon-output-area h3 {
    font-size: 0.9rem;
    color: var(--secondary);
    margin-bottom: 1rem;
    text-transform: uppercase;
}

/* Sidebar & Cards */
#aon-sidebar {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    animation: slideInRight 0.6s ease-out;
}

.aon-module-card {
    background: var(--surface);
    backdrop-filter: var(--glass-effect);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
}

.aon-module-card h3 {
    font-size: 1.1rem;
    margin-bottom: 1.25rem;
    color: var(--text-main);
}

.aon-walkthrough-list {
    list-style: none;
}

/* Placeholders & Skeletons */
.aon-placeholder {
    color: var(--text-muted);
    position: relative;
    overflow: hidden;
    min-height: 60px;
    display: flex;
    align-items: center;
}

.aon-placeholder::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    animation: pulse 1.5s infinite;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes pulse {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* Utility */
.aon-context-wrapper {
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 1rem;
}

/* Responsive Overrides */
@media (max-width: 1280px) {
    .aon-split-layout {
        grid-template-columns: 1fr;
        padding: 0 2rem 2rem 2rem;
    }
    
    #aon-sidebar {
        flex-direction: row;
    }
    
    .aon-module-card {
        flex: 1;
    }
}

@media (max-width: 768px) {
    .aon-brand { padding: 1.5rem; }
    #aon-sidebar { flex-direction: column; }
    .aon-split-layout { padding: 1rem; }
}
    </style>
</head>
<body>
    <div class="aon-brand">
        <h1>AgentMaximize</h1>
        <p class="aon-tagline">Optimizing human-AI synergy through precision engineering.</p>
    </div>


<main id="aon-main" class="aon-split-layout">
    <section id="aon-content" data-module="mod_2" class="aon-chat-container">
        
            <h2>Prompt Refinement Lab</h2>
            <div class="aon-controls">
                <label class="aon-switch">
                    <span>Refinement Toggle</span>
                    <input type="checkbox" id="aon-refinement-toggle" checked>
                </label>
            </div>
        

        <div id="aon-prompt-editor" class="aon-editor-box">
            <label for="aon-input-1">Input Base Query</label>
            <textarea id="aon-input-1" placeholder="Enter your raw prompt here..."></textarea>
            
            <div class="aon-action-bar">
                <button id="aon-btn-1" class="aon-primary-btn">Transform Instruction</button>
            </div>
        </div>

        <article id="aon-display-1" class="aon-output-area">
            <h3>Refined Output</h3>
            <div id="aon-data-refined-output" class="aon-placeholder">Loading...</div>
        </article>
    </section>

    <aside id="aon-sidebar">
        <section data-module="mod_1" class="aon-module-card">
            <h3>Contextual Guidance Engine</h3>
            <div class="aon-context-wrapper">
                <div id="aon-data-context-tips" class="aon-placeholder">Loading...</div>
            </div>
        </section>

        <section data-module="mod_3" class="aon-module-card">
            <h3>Interactive Support Hub</h3>
            <nav id="aon-feature-discovery">
                <ul class="aon-walkthrough-list">
                    <li><button class="aon-link-btn" id="aon-btn-discovery">Discovery Walkthrough</button></li>
                    <li><button class="aon-link-btn" id="aon-btn-capability">New Capabilities</button></li>
                </ul>
            </nav>
            <div id="aon-data-support-feed" class="aon-placeholder">Loading...</div>
        </section>
    </aside>
</main>

<footer id="aon-footer">
    <div id="aon-data-system-status">Loading...</div>
</footer>
    <div class="aon-watermark">⚡ AON AI FACTORY v5.0</div>
    <script>
    (async () => {
        document.addEventListener('DOMContentLoaded', () => {
    /**
     * STATE MANAGEMENT
     */
    const state = {
        activeInput: "",
        currentOptimizedResult: "",
        selectedCapabilityFilter: "all",
        isGenerating: false,
        historyStack: [],
        mockData: {
            usage_patterns: [
                {
                    raw_input: "write a summary of this text",
                    optimized_prompt: "Act as a professional editor. Provide a concise 3-bullet point summary of the following text, focusing on actionable insights.",
                    capability_tags: ["summarization", "professional_tone", "extraction"]
                },
                {
                    raw_input: "fix my python script",
                    optimized_prompt: "Analyze the provided Python script for logical errors and PEP8 compliance issues. Provide the corrected code with comments explaining each fix.",
                    capability_tags: ["debugging", "python", "optimization"]
                }
            ],
            instruction_templates: [
                {
                    template_id: "temp_001",
                    name: "Persona-Based Reasoning",
                    raw_input: "[User Topic]",
                    optimized_prompt: "You are an expert in [Field]. Step through your reasoning process for [User Topic] before providing a final conclusion.",
                    capability_tags: ["chain_of_thought", "expert_persona"]
                }
            ]
        }
    };

    /**
     * DOM SELECTORS
     */
    const elements = {
        inputField: document.getElementById('aon-input-1'),
        transformBtn: document.getElementById('aon-btn-1'),
        refinedOutput: document.getElementById('aon-data-refined-output'),
        contextTips: document.getElementById('aon-data-context-tips'),
        supportFeed: document.getElementById('aon-data-support-feed'),
        systemStatus: document.getElementById('aon-data-system-status'),
        refinementToggle: document.getElementById('aon-refinement-toggle'),
        discoveryBtn: document.getElementById('aon-btn-discovery'),
        capabilityBtn: document.getElementById('aon-btn-capability')
    };

    /**
     * CORE UTILITIES
     */
    const updateUI = (target, content, isError = false) => {
        if (!target) return;
        target.innerHTML = content;
        target.style.color = isError ? '#ef4444' : 'inherit';
        if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    const setGeneratingState = (isGenerating) => {
        state.isGenerating = isGenerating;
        elements.transformBtn.disabled = isGenerating;
        elements.transformBtn.textContent = isGenerating ? "Processing..." : "Transform Instruction";
        elements.transformBtn.style.opacity = isGenerating ? "0.7" : "1";
        
        if (isGenerating) {
            elements.refinedOutput.classList.add('aon-loading-pulse');
            elements.refinedOutput.textContent = "Synthesizing optimal prompt structure...";
        } else {
            elements.refinedOutput.classList.remove('aon-loading-pulse');
        }
    };

    /**
     * EVENT HANDLERS
     */
    const handleInputChange = (e) => {
        state.activeInput = e.target.value;
    };

    const triggerPromptOptimization = async () => {
        if (!state.activeInput.trim()) {
            updateUI(elements.refinedOutput, "Please enter a base query first.");
            return;
        }

        const useRefinement = elements.refinementToggle.checked;
        setGeneratingState(true);

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: state.activeInput,
                    mission: "how can i use this agent at it's best ?",
                    refine: useRefinement
                })
            });

            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            state.currentOptimizedResult = data.reply || "Optimization complete. No significant changes suggested.";
            state.historyStack.push({ input: state.activeInput, output: state.currentOptimizedResult });
            
            renderRefinedOutput();
            updateSystemStatus("System optimized successfully.");
        } catch (error) {
            console.error('Optimization Error:', error);
            updateUI(elements.refinedOutput, "Error connecting to optimization engine. Please try again.", true);
            updateSystemStatus("Connection failed.", true);
        } finally {
            setGeneratingState(false);
        }
    };

    const applyTemplateToInput = (templateId) => {
        const template = state.mockData.instruction_templates.find(t => t.template_id === templateId);
        if (template) {
            elements.inputField.value = template.optimized_prompt;
            state.activeInput = template.optimized_prompt;
            elements.inputField.focus();
            
            // Micro-animation
            elements.inputField.style.transform = "scale(1.02)";
            setTimeout(() => elements.inputField.style.transform = "scale(1)", 200);
        }
    };

    const copyOptimizedPromptToClipboard = () => {
        if (!state.currentOptimizedResult) return;
        navigator.clipboard.writeText(state.currentOptimizedResult)
            .then(() => {
                const originalText = elements.refinedOutput.innerHTML;
                elements.refinedOutput.innerHTML = "<strong>Copied to clipboard!</strong>";
                setTimeout(() => renderRefinedOutput(), 1500);
            });
    };

    const filterPatternsByCategory = (category) => {
        state.selectedCapabilityFilter = category;
        renderContextTips();
    };

    /**
     * RENDERERS
     */
    const renderRefinedOutput = () => {
        if (!state.currentOptimizedResult) return;
        
        const html = `
            <div class="aon-result-card">
                <p>${state.currentOptimizedResult}</p>
                <div class="aon-action-bar">
                    <button class="aon-secondary-btn" id="aon-btn-copy">Copy to Clipboard</button>
                </div>
            </div>
        `;
        updateUI(elements.refinedOutput, html);
        
        document.getElementById('aon-btn-copy')?.addEventListener('click', copyOptimizedPromptToClipboard);
    };

    const renderContextTips = () => {
        const patterns = state.mockData.usage_patterns;
        const html = patterns.map(p => `
            <div class="aon-tip-item" style="cursor:pointer; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
                <small class="aon-tag">${p.capability_tags.join(', ')}</small>
                <p><strong>Raw:</strong> ${p.raw_input}</p>
                <button class="aon-link-btn" onclick="document.getElementById('aon-input-1').value='${p.raw_input}'; state.activeInput='${p.raw_input}';">Try this</button>
            </div>
        `).join('');
        updateUI(elements.contextTips, html);
    };

    const renderSupportFeed = () => {
        const templates = state.mockData.instruction_templates;
        const html = templates.map(t => `
            <div class="aon-template-card" style="padding: 0.5rem; background: rgba(0,0,0,0.02); margin-top: 0.5rem;">
                <strong>${t.name}</strong>
                <button class="aon-primary-btn" style="display:block; margin-top:0.5rem; font-size: 0.8rem;" data-template="${t.template_id}">Use Template</button>
            </div>
        `).join('');
        updateUI(elements.supportFeed, html);

        // Attach dynamic listeners
        elements.supportFeed.querySelectorAll('[data-template]').forEach(btn => {
            btn.addEventListener('click', () => applyTemplateToInput(btn.dataset.template));
        });
    };

    const updateSystemStatus = (msg, isError = false) => {
        const time = new Date().toLocaleTimeString();
        elements.systemStatus.innerHTML = `
            <span class="aon-status-indicator" style="background: ${isError ? '#ef4444' : '#22c55e'};"></span>
            Status: ${msg} | Last Sync: ${time}
        `;
    };

    /**
     * INITIALIZATION
     */
    const init = async () => {
        // Event Listeners
        elements.inputField.addEventListener('input', handleInputChange);
        elements.transformBtn.addEventListener('click', triggerPromptOptimization);
        
        elements.discoveryBtn.addEventListener('click', () => {
            alert("Discovery Mode: Highlighting core AgentMaximize features. Use the Refinement Lab to upgrade base queries into high-performance LLM instructions.");
        });

        elements.capabilityBtn.addEventListener('click', async () => {
            try {
                updateUI(elements.supportFeed, "Fetching new capabilities...");
                const res = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: "new_features" })
                });
                const data = await res.json();
                updateSystemStatus("Search capabilities updated.");
                renderSupportFeed();
            } catch (e) {
                updateUI(elements.supportFeed, "Capability search unavailable locally.");
            }
        });

        // Initialize UI with mock data
        renderContextTips();
        renderSupportFeed();
        updateSystemStatus("AgentMaximize Core Online");
        
        // Initial refined output state
        elements.refinedOutput.textContent = "Enter a prompt and click Transform to see results.";

        // Micro-animations for buttons
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => btn.style.transform = "scale(0.95)");
            btn.addEventListener('mouseup', () => btn.style.transform = "scale(1)");
            btn.addEventListener('mouseleave', () => btn.style.transform = "scale(1)");
            btn.style.transition = "transform 0.1s ease";
        });
    };

    init();
});
        if (typeof lucide !== 'undefined') lucide.createIcons();
    })();
    </script>
</body>
</html>
