<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aon AI | Self-Heal Demonstration</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1;
            --secondary: #10B981;
            --bg: #050507;
            --surface: #111;
            --error: #ef4444;
            --text: #f0f0f5;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        #aon-self-heal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .heal-card {
            background: var(--surface); border: 1px solid var(--error); border-radius: 20px;
            padding: 40px; max-width: 500px; box-shadow: 0 0 50px rgba(239, 68, 68, 0.2);
        }
        .heal-btn {
            background: var(--primary); color: white; border: none; padding: 15px 30px;
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px;
            transition: 0.3s;
        }
        .heal-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary); }
    </style>
</head>
<body>
    <div id="aon-self-heal-overlay">
        <div class="heal-card">
            <h2 style="color: var(--error); font-family: 'Outfit';">Neural Instability Detected</h2>
            <p style="opacity: 0.7;">An unexpected runtime error has occurred in the agent's logic pathway.</p>
            <div id="error-details" style="font-family: monospace; font-size: 11px; background: #000; padding: 10px; border-radius: 8px; color: #ff9d9d; margin: 20px 0; text-align: left;">
                ReferenceError: state is not defined (Simulated)
            </div>
            <button id="repair-btn" class="heal-btn">Execute Self-Repair</button>
        </div>
    </div>

    <div>
        <h1 style="font-family: 'Outfit';">Self-Healing Demo</h1>
        <p>Waiting for simulated crash... (2 seconds)</p>
    </div>

    <script>
        const overlay = document.getElementById('aon-self-heal-overlay');
        const repairBtn = document.getElementById('repair-btn');

        // SIMULATE CRASH after 2 seconds
        setTimeout(() => {
            overlay.style.display = 'flex';
        }, 2000);

        repairBtn.onclick = () => {
            repairBtn.innerText = "Repairing Neural Pathways...";
            repairBtn.disabled = true;
            setTimeout(() => {
                alert("This is a simulation. In a real crash, the Aon Factory would now be patching your code!");
                location.reload();
            }, 2000);
        };
    </script>
</body>
</html>
