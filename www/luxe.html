<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Luxe v8.0 | The Gold Standard of AI</title>
    <link rel="stylesheet" href="luxe.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;800&family=Outfit:wght@900&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="luxe-mode">
    
    <div class="luxe-orb"></div>

    <div style="padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 800px; margin: 0 auto;">
        
        <div class="luxe-panel">
            <span class="luxe-accent-text">infinite intelligence</span>
            <h1 class="luxe-headline">NEXUS<br>LUXE</h1>

            <div style="color: var(--luxury-dim); font-size: 1.1rem; line-height: 1.6; max-width: 500px; margin-bottom: 2rem;">
                Experience a new dimension of high-fidelity prompt synthesis. Designed for the few who demand absolute precision.
            </div>

            <div class="luxe-stats">
                <div class="stat-group">
                    <div class="stat-val">0.02</div>
                    <div class="stat-label">Precision Flux</div>
                </div>
                <div class="stat-group">
                    <div class="stat-val">100%</div>
                    <div class="stat-label">Neural Integrity</div>
                </div>
            </div>

            <div style="margin-top: 3rem; position: relative;">
                <textarea placeholder="Specify your objective..." style="width: 100%; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; font-family: 'Inter', sans-serif; font-size: 1.4rem; font-weight: 200; outline: none; padding-bottom: 1rem; margin-bottom: 2rem;"></textarea>
                
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <button class="luxe-btn">Initialize Synthesis</button>
                    <div style="font-size: 0.6rem; letter-spacing: 0.2em; color: var(--luxury-dim);">AON INTELLIGENCE v8.0</div>
                </div>
            </div>
        </div>

        <footer style="margin-top: 4rem; display: flex; justify-content: space-between; color: var(--luxury-dim); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;">
            <div>© 2026 NEXUS INDUSTRIES</div>
            <div>London • New York • Tokyo</div>
        </footer>

    </div>

</body>
</html>
