<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt Maximize | Elite v6.0 Preview</title>
    <link rel="stylesheet" href="preview.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="elite-mode">
    <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; min-height: 100vh;">
        
        <!-- Header -->
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; letter-spacing: -0.02em;">
                <span style="color: var(--accent-cyan);">PROMPT</span> MAXIMIZE
            </div>
            <div style="width: 40px; height: 40px; background: var(--prism-gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800;">L</div>
        </header>

        <!-- Main Orb Display -->
        <div class="elite-card glowing" style="text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center;">
            <div class="orb-container">
                <div class="orb-hologram"></div>
                <canvas id="orb-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%;"></canvas>
            </div>
            
            <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; margin-bottom: 0.5rem;">AI MISSION CONTROL</h1>
            <div class="status-pill" style="margin: 0 auto;">
                <div class="status-dot"></div>
                ACTIVE • 100% ONLINE
            </div>

            <!-- Stats -->
            <div class="data-grid">
                <div class="data-node">
                    <div class="node-value">1,452</div>
                    <div class="node-label">Nodes</div>
                </div>
                <div class="data-node">
                    <div class="node-value">98.7%</div>
                    <div class="node-label">Rate</div>
                </div>
                <div class="data-node">
                    <div class="node-value">14.5 TB/s</div>
                    <div class="node-label">Flow</div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="elite-card" style="border-color: rgba(255,255,255,0.05);">
            <div style="color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-bottom: 0.8rem;">
                <i class="fas fa-terminal"></i> READY FOR SYNTHESIS_
            </div>
            <textarea placeholder="Enter a simple prompt to maximize..." style="width: 100%; background: none; border: none; color: white; font-family: 'Inter', sans-serif; font-size: 1rem; outline: none; min-height: 80px; resize: none;"></textarea>
            
            <button class="elite-btn" style="margin-top: 1rem;">
                MAXIMIZE PROMPT <i class="fas fa-bolt" style="margin-left: 0.5rem;"></i>
            </button>
        </div>

        <p style="text-align: center; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.05em;">
            NEXUS PRIME v6.0 INTELLIGENCE CORE
        </p>

    </div>

    <script>
        // Simplified Orb Animation for Preview
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        for(let i = 0; i < 40; i++) {
            particles.push({
                x: width/2,
                y: height/2,
                r: Math.random() * 2 + 1,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.02 + 0.01,
                dist: Math.random() * 60 + 30
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.angle += p.speed;
                const x = width/2 + Math.cos(p.angle) * p.dist;
                const y = height/2 + Math.sin(p.angle) * p.dist;
                
                ctx.beginPath();
                ctx.arc(x, y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 242, 255, 0.6)';
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
