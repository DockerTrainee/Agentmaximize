<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Omega v7.0 | The Future of AI</title>
    <link rel="stylesheet" href="omega.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Outfit:wght@800;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="omega-mode">
    
    <canvas id="neural-canvas"></canvas>

    <div style="padding: 2rem; display: flex; flex-direction: column; gap: 1rem; min-height: 100vh; position: relative; z-index: 10;">
        
        <!-- Top Nav -->
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div style="font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.2rem; letter-spacing: -0.02em;">
                <span style="color: var(--accent-cyan);">NEXUS</span> OMEGA
            </div>
            <div style="display: flex; gap: 1rem;">
                <i class="fas fa-signal" style="color: var(--accent-cyan); font-size: 0.8rem;"></i>
                <i class="fas fa-shield-alt" style="color: var(--accent-purple); font-size: 0.8rem;"></i>
            </div>
        </header>

        <!-- Main Hero Card -->
        <div class="omega-card" id="hero-card">
            <h1 class="omega-title">NEXUS PRIME</h1>
            <p class="omega-subtitle">NEURAL SYSTEM ACTIVE</p>

            <div class="quantum-core">
                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <canvas id="quantum-canvas" style="width: 100%; height: 100%; position: absolute;"></canvas>
            </div>

            <div class="hud-box">
                <div class="hud-item">
                    <div class="hud-val">7.42</div>
                    <div class="hud-lab">Latency ms</div>
                </div>
                <div class="hud-item">
                    <div class="hud-val">∞</div>
                    <div class="hud-lab">Entropy</div>
                </div>
                <div class="hud-item">
                    <div class="hud-val">99%</div>
                    <div class="hud-lab">Precision</div>
                </div>
            </div>
        </div>

        <!-- Action Card -->
        <div class="omega-card" style="margin-top: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; color: var(--accent-cyan);">
                    <i class="fas fa-brain"></i> COGNITIVE INPUT...
                </div>
                <div style="font-size: 0.6rem; color: var(--text-dim);">AES-256 SECURE</div>
            </div>
            
            <div class="input-shell">
                <textarea placeholder="Synthesize your reality..." style="width: 100%; background: none; border: none; color: white; font-family: 'Inter', sans-serif; font-size: 1.1rem; outline: none; min-height: 100px; resize: none;"></textarea>
            </div>

            <button class="omega-btn">
                INITIATE MAXIMIZATION <i class="fas fa-long-arrow-alt-right" style="margin-left: 0.8rem;"></i>
            </button>
        </div>

        <!-- Bottom Status -->
        <div style="margin-top: auto; padding-top: 2rem; display: flex; justify-content: center; gap: 2rem; font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; color: var(--text-dim);">
            <span><i class="fas fa-circle" style="color: var(--accent-cyan); font-size: 0.4rem; margin-right: 0.4rem;"></i> UPTIME 99.99%</span>
            <span><i class="fas fa-microchip" style="margin-right: 0.4rem;"></i> v7.0.42-OMEGA</span>
        </div>

    </div>

    <script>
        // --- NEURAL BACKGROUND ---
        const nCanvas = document.getElementById('neural-canvas');
        const nCtx = nCanvas.getContext('2d');
        let nW, nH;

        function resizeN() {
            nW = nCanvas.width = window.innerWidth;
            nH = nCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeN);
        resizeN();

        const dots = [];
        for(let i=0; i<60; i++) {
            dots.push({
                x: Math.random() * nW,
                y: Math.random() * nH,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function drawN() {
            nCtx.clearRect(0, 0, nW, nH);
            nCtx.fillStyle = 'rgba(0, 242, 255, 0.5)';
            nCtx.strokeStyle = 'rgba(0, 242, 255, 0.1)';

            dots.forEach((d, i) => {
                d.x += d.vx;
                d.y += d.vy;
                if(d.x < 0 || d.x > nW) d.vx *= -1;
                if(d.y < 0 || d.y > nH) d.vy *= -1;

                nCtx.beginPath();
                nCtx.arc(d.x, d.y, 1.5, 0, Math.PI*2);
                nCtx.fill();

                for(let j=i+1; j<dots.length; j++) {
                    const d2 = dots[j];
                    const dist = Math.hypot(d.x - d2.x, d.y - d2.y);
                    if(dist < 150) {
                        nCtx.lineWidth = 1 - dist/150;
                        nCtx.beginPath();
                        nCtx.moveTo(d.x, d.y);
                        nCtx.lineTo(d2.x, d2.y);
                        nCtx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawN);
        }
        drawN();

        // --- QUANTUM CORE ---
        const qCanvas = document.getElementById('quantum-canvas');
        const qCtx = qCanvas.getContext('2d');
        let qW, qH;

        function resizeQ() {
            qW = qCanvas.width = qCanvas.offsetWidth;
            qH = qCanvas.height = qCanvas.offsetHeight;
        }
        resizeQ();

        let time = 0;
        function drawQ() {
            qCtx.clearRect(0, 0, qW, qH);
            time += 0.02;

            const cx = qW/2;
            const cy = qH/2;

            // Draw core energy
            const grad = qCtx.createRadialGradient(cx, cy, 0, cx, cy, qW/2);
            grad.addColorStop(0, 'rgba(0, 242, 255, 0.8)');
            grad.addColorStop(0.3, 'rgba(161, 0, 255, 0.4)');
            grad.addColorStop(1, 'transparent');

            qCtx.fillStyle = grad;
            qCtx.beginPath();
            qCtx.arc(cx, cy, (Math.sin(time) * 10 + 60), 0, Math.PI*2);
            qCtx.fill();

            // Draw orbital flares
            for(let i=0; i<3; i++) {
                qCtx.strokeStyle = i === 0 ? '#00f2ff' : '#a100ff';
                qCtx.lineWidth = 2;
                qCtx.beginPath();
                const r = 70 + i*15;
                const offset = time * (i+1) * 0.5;
                for(let a=0; a<Math.PI*2; a+=0.1) {
                    const noise = Math.sin(a * 5 + time * 2) * 5;
                    const x = cx + Math.cos(a + offset) * (r + noise);
                    const y = cy + Math.sin(a + offset) * (r + noise);
                    if(a === 0) qCtx.moveTo(x, y);
                    else qCtx.lineTo(x, y);
                }
                qCtx.closePath();
                qCtx.stroke();
            }

            requestAnimationFrame(drawQ);
        }
        drawQ();

        // 3D Tilt Effect
        const card = document.getElementById('hero-card');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
</body>
</html>
