<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Velocity v13.0 | Professional AI Dashboard</title>
    <link rel="stylesheet" href="velocity.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="velocity-mode bg-[#0a0b10] text-white">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-bolt text-xs"></i>
                </div>
                <h1 class="font-bold tracking-tight text-lg">NEXUS <span class="text-blue-500">VELOCITY</span></h1>
            </div>
            <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center">
                <i class="fas fa-user text-[10px] text-gray-400"></i>
            </div>
        </header>

        <!-- Framework Nav -->
        <nav class="v-nav mb-6">
            <div class="nav-item active">DASHBOARD</div>
            <div class="nav-item">HISTORY</div>
            <div class="nav-item">SETTINGS</div>
        </nav>

        <!-- Main Workspace -->
        <div class="v-panel flex-1 flex flex-col">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <div class="v-chip mb-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></span>
                        SYSTEM READY
                    </div>
                    <h2 class="text-2xl font-extrabold tracking-tight">Intelligence Node</h2>
                </div>
                <button class="text-gray-500 hover:text-white transition-colors">
                    <i class="fas fa-ellipsis-h"></i>
                </button>
            </div>

            <!-- The Waveform Core -->
            <div class="wave-container">
                <canvas id="wave-canvas"></canvas>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-auto">
                <div class="p-4 bg-gray-900/50 rounded-xl border border-gray-800">
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Load</div>
                    <div class="text-lg font-bold">14.2%</div>
                </div>
                <div class="p-4 bg-gray-900/50 rounded-xl border border-gray-800">
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Latency</div>
                    <div class="text-lg font-bold text-emerald-400">0.02ms</div>
                </div>
            </div>
        </div>

        <!-- Command Bar -->
        <div class="mt-6 v-panel !p-4 !bg-black">
            <div class="flex items-center gap-3">
                <i class="fas fa-terminal text-blue-500 text-xs"></i>
                <input type="text" placeholder="Type a command or objective..." class="bg-transparent border-none outline-none flex-1 text-sm font-medium placeholder:text-gray-600">
                <button class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center hover:bg-blue-500 transition-colors">
                    <i class="fas fa-arrow-up text-xs"></i>
                </button>
            </div>
        </div>

        <footer class="mt-8 text-center text-[10px] text-gray-600 font-medium tracking-wide uppercase">
            Nexus Velocity Framework • Build 13.0.42
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('wave-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;
        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.03;

            const centerY = height / 2;
            
            // Draw Multiple Sine Waves with Saturated Colors
            const waves = [
                { amp: 40, freq: 0.02, color: 'rgba(59, 130, 246, 0.4)', speed: 1 },
                { amp: 30, freq: 0.03, color: 'rgba(16, 185, 129, 0.3)', speed: 1.5 },
                { amp: 20, freq: 0.015, color: 'rgba(99, 102, 241, 0.2)', speed: 0.8 }
            ];

            waves.forEach(w => {
                ctx.beginPath();
                ctx.strokeStyle = w.color;
                ctx.lineWidth = 2;
                
                for(let x = 0; x < width; x += 1) {
                    const y = centerY + Math.sin(x * w.freq + time * w.speed) * w.amp;
                    if(x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            });

            // Draw Central Pulse Line
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
